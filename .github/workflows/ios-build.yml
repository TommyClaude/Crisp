name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  # Run manually to refresh the screenshots in ios/screenshots.
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build CamSweep (iOS simulator)
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ios/scripts/build.sh

  screenshots:
    name: Refresh screenshots
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ios/scripts/build.sh

      - name: Capture
        run: >
          ios/scripts/screenshots.sh
          ios/build/Debug-iphonesimulator/CamSweep.app
          ios/screenshots
          home infrared magnetic wifi guide

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged."
            exit 0
          fi
          git commit -m "Update CamSweep screenshots"
          git push
