name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build CamSweep (iOS simulator)
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        working-directory: ios
        run: |
          xcodebuild \
            -project CamSweep.xcodeproj \
            -target CamSweep \
            -configuration Debug \
            -sdk iphonesimulator \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            SYMROOT="$PWD/build" \
            -quiet \
            build

      - name: Screenshots
        working-directory: ios
        run: scripts/screenshots.sh build/Debug-iphonesimulator/CamSweep.app build/screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v5
        with:
          name: screenshots
          path: ios/build/screenshots
          if-no-files-found: error
